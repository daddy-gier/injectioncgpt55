name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd source/repos/ConsoleApp1/server && npm ci

      - name: Lint
        run: npm run lint
        working-directory: source/repos/ConsoleApp1

      - name: Build
        run: npm run build
        working-directory: source/repos/ConsoleApp1

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm audit --audit-level=moderate
        working-directory: source/repos/ConsoleApp1
        continue-on-error: true

  notify-on-failure:
    needs: [lint-and-test, security-audit]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failed on ${context.ref} — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow **${context.workflow}** failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure'],
            });
