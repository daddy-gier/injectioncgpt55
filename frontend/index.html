<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unreal Engine AI Expert</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #16181c;
      --surface2: #1e2028;
      --border: #2a2d38;
      --accent: #0070f3;
      --accent-hover: #0058cc;
      --ue-orange: #ff6b00;
      --text: #e8e9ec;
      --text-muted: #8b8fa8;
      --code-bg: #111318;
      --user-bubble: #1a2744;
      --ai-bubble: #16181c;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: var(--ue-orange);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: #fff;
      letter-spacing: -1px;
    }

    header h1 {
      font-size: 17px;
      font-weight: 600;
    }

    header .sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .version-select {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .version-select select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .clear-btn:hover {
      border-color: var(--ue-orange);
      color: var(--ue-orange);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 820px;
      margin: 0 auto 20px;
      padding: 0 20px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .avatar.user { background: #1a3a6b; color: #4d9fff; }
    .avatar.ai   { background: var(--ue-orange); color: #fff; font-size: 11px; }

    .bubble {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      line-height: 1.7;
      font-size: 15px;
    }

    .bubble.user {
      background: var(--user-bubble);
      border-color: #1d3463;
    }

    .bubble p { margin-bottom: 12px; }
    .bubble p:last-child { margin-bottom: 0; }

    .bubble h1, .bubble h2, .bubble h3 {
      margin: 18px 0 8px;
      color: var(--ue-orange);
    }

    .bubble h1:first-child,
    .bubble h2:first-child,
    .bubble h3:first-child { margin-top: 0; }

    .bubble ul, .bubble ol {
      margin: 8px 0 8px 20px;
    }

    .bubble li { margin-bottom: 4px; }

    .bubble code {
      font-family: var(--font-mono);
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: #7dd3fc;
    }

    .bubble pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .bubble pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      color: #e2e8f0;
    }

    .bubble strong { color: #fff; }
    .bubble em { color: var(--text-muted); }

    .bubble blockquote {
      border-left: 3px solid var(--ue-orange);
      padding-left: 12px;
      color: var(--text-muted);
      margin: 8px 0;
    }

    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 6px 0;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--ue-orange);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
      opacity: 0.6;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    .suggestions {
      max-width: 820px;
      margin: 0 auto 24px;
      padding: 0 20px;
    }

    .suggestions p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }

    .suggestion-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
    }

    .suggestion-btn:hover {
      border-color: var(--ue-orange);
      color: var(--ue-orange);
      background: rgba(255, 107, 0, 0.05);
    }

    footer {
      padding: 14px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 50px;
      max-height: 200px;
      line-height: 1.5;
      transition: border-color 0.15s;
    }

    #input:focus {
      outline: none;
      border-color: var(--ue-orange);
    }

    #input::placeholder { color: var(--text-muted); }

    #send {
      background: var(--ue-orange);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
      height: 50px;
    }

    #send:hover { background: #e05e00; }
    #send:disabled { background: #4a3020; color: #666; cursor: not-allowed; }

    .hint {
      max-width: 820px;
      margin: 6px auto 0;
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">UE</div>
  <div>
    <h1>Unreal Engine AI Expert</h1>
    <div class="sub">Deep knowledge of every UE system — ask anything</div>
  </div>
  <div class="version-select">
    UE Version:
    <select id="ueVersion">
      <option value="5.4">UE 5.4</option>
      <option value="5.3">UE 5.3</option>
      <option value="5.2">UE 5.2</option>
      <option value="5.1">UE 5.1</option>
      <option value="5.0">UE 5.0</option>
      <option value="4.27">UE 4.27</option>
      <option value="4.26">UE 4.26</option>
    </select>
    <button class="clear-btn" id="clearBtn">Clear Chat</button>
  </div>
</header>

<div id="chat">
  <div class="suggestions" id="suggestions">
    <p>Try asking:</p>
    <div class="suggestion-grid">
      <button class="suggestion-btn" onclick="sendSuggestion(this)">How does Unreal's garbage collector find and free UObjects?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Explain how Lumen calculates indirect lighting internally</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">How does actor replication work under the hood — what happens each network tick?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">When should I use GAS vs a custom ability system?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">How do I write a custom render pass using the RDG?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">What's the difference between World Partition and traditional level streaming?</button>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Ask anything about Unreal Engine…" rows="1"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint">Shift+Enter for new line · Enter to send</div>
</footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const ueVersion = document.getElementById('ueVersion');
  const sessionId = Math.random().toString(36).slice(2);
  let isLoading = false;

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(text) {
    // Code blocks
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escapeHtml(code.trim())}</code></pre>`
    );
    // Inline code
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Headers
    text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    // Blockquote
    text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
    // Unordered list
    text = text.replace(/((?:^- .+\n?)+)/gm, match => {
      const items = match.trim().split('\n').map(l => `<li>${l.slice(2)}</li>`).join('');
      return `<ul>${items}</ul>`;
    });
    // Ordered list
    text = text.replace(/((?:^\d+\. .+\n?)+)/gm, match => {
      const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /,'')}</li>`).join('');
      return `<ol>${items}</ol>`;
    });
    // Paragraphs
    text = text.split(/\n{2,}/).map(p => {
      if (p.startsWith('<')) return p;
      return `<p>${p.replace(/\n/g, '<br>')}</p>`;
    }).join('');
    return text;
  }

  function appendMessage(role, content) {
    const div = document.createElement('div');
    div.className = 'message';
    const avatarText = role === 'user' ? 'You' : 'UE';
    const html = `
      <div class="avatar ${role}">${avatarText}</div>
      <div class="bubble ${role}">${role === 'ai' ? renderMarkdown(content) : escapeHtml(content).replace(/\n/g,'<br>')}</div>
    `;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function appendTyping() {
    const div = document.createElement('div');
    div.className = 'message';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="avatar ai">UE</div>
      <div class="bubble ai"><div class="typing"><span></span><span></span><span></span></div></div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    document.getElementById('typing-indicator')?.remove();
  }

  async function sendMessage(text) {
    if (!text.trim() || isLoading) return;
    document.getElementById('suggestions')?.remove();

    isLoading = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    appendMessage('user', text);
    appendTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          session_id: sessionId,
          ue_version: ueVersion.value
        })
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json();
        appendMessage('ai', `Error: ${err.detail || 'Something went wrong.'}`);
      } else {
        const data = await res.json();
        appendMessage('ai', data.reply);
      }
    } catch (e) {
      removeTyping();
      appendMessage('ai', `Connection error: ${e.message}. Is the backend running?`);
    }

    isLoading = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function sendSuggestion(btn) {
    sendMessage(btn.textContent);
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input.value);
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  });

  document.getElementById('clearBtn').addEventListener('click', async () => {
    await fetch(`/chat/${sessionId}`, { method: 'DELETE' });
    chat.innerHTML = '';
  });
</script>
</body>
</html>
