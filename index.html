<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HyPro3000 Projector Remote</title>
<style>
  :root {
    --bg: #101218;
    --remote: #1c1f2a;
    --remote-edge: #0a0c12;
    --accent: #ff5a1f;
    --accent-dim: #b33e14;
    --btn: #2a2f3d;
    --btn-hi: #3a4051;
    --btn-text: #e6e8ee;
    --led: #38ff7a;
    --screen-bg: #0b1a10;
    --screen-text: #9cffb8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(1200px 600px at 20% 0%, #1a1d2a 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 100%, #181a25 0%, transparent 55%),
      var(--bg);
    color: var(--btn-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 48px;
  }
  h1 {
    margin: 4px 0 16px;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: #b8bccc;
    font-weight: 500;
  }
  h1 .brand { color: var(--accent); font-weight: 700; }

  .remote {
    width: 320px;
    background: linear-gradient(180deg, #23273a 0%, #1a1d2a 40%, #13151d 100%);
    border: 1px solid var(--remote-edge);
    border-radius: 36px;
    padding: 22px 20px 30px;
    box-shadow:
      0 20px 40px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.05),
      inset 0 -2px 6px rgba(0,0,0,0.6);
    position: relative;
  }
  .remote::before {
    content: "";
    position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 5px;
    background: #0a0c12;
    border-radius: 3px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  .brand-plate {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 2px 12px;
  }
  .brand-plate .logo {
    font-weight: 800;
    letter-spacing: 3px;
    font-size: 0.85rem;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(255,90,31,0.4);
  }
  .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: #0d2a18;
    box-shadow: inset 0 0 2px rgba(0,0,0,0.8);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .led.on {
    background: var(--led);
    box-shadow: 0 0 10px var(--led), 0 0 2px #fff;
  }

  .screen {
    background: var(--screen-bg);
    color: var(--screen-text);
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 0.8rem;
    padding: 10px 12px;
    border-radius: 8px;
    min-height: 46px;
    margin-bottom: 16px;
    border: 1px solid #06120a;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
    line-height: 1.3;
    overflow: hidden;
  }
  .screen .line { opacity: 0.55; }
  .screen .line.latest { opacity: 1; color: #d7ffe2; }

  .row {
    display: grid;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row.two { grid-template-columns: 1fr 1fr; }
  .row.three { grid-template-columns: repeat(3, 1fr); }
  .row.four { grid-template-columns: repeat(4, 1fr); }

  .btn {
    appearance: none;
    border: 1px solid #0a0c12;
    background: linear-gradient(180deg, var(--btn-hi) 0%, var(--btn) 55%, #1d2130 100%);
    color: var(--btn-text);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 10px 6px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow:
      0 2px 0 #0a0c12,
      inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.06s, box-shadow 0.06s, background 0.15s;
    user-select: none;
    text-align: center;
  }
  .btn:hover { background: linear-gradient(180deg, #434a5e 0%, #30354a 55%, #222636 100%); }
  .btn:active,
  .btn.pressed {
    transform: translateY(2px);
    box-shadow: 0 0 0 #0a0c12, inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .btn.power {
    background: linear-gradient(180deg, #ff7a3f 0%, var(--accent) 55%, var(--accent-dim) 100%);
    color: #fff;
    font-size: 1rem;
    padding: 14px;
    border-radius: 999px;
    width: 54px; height: 54px;
    margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .btn.power:hover { filter: brightness(1.08); }
  .power-wrap { display: flex; justify-content: center; margin-bottom: 14px; }

  .dpad {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 8px auto 14px;
  }
  .dpad .btn {
    position: absolute;
    width: 64px; height: 64px;
    padding: 0;
    font-size: 1.1rem;
    border-radius: 12px;
  }
  .dpad .up    { top: 0;    left: 50%; transform: translateX(-50%); border-radius: 14px 14px 4px 4px; }
  .dpad .down  { bottom: 0; left: 50%; transform: translateX(-50%); border-radius: 4px 4px 14px 14px; }
  .dpad .left  { left: 0;   top: 50%;  transform: translateY(-50%); border-radius: 14px 4px 4px 14px; }
  .dpad .right { right: 0;  top: 50%;  transform: translateY(-50%); border-radius: 4px 14px 14px 4px; }
  .dpad .ok {
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(180deg, #5c6480 0%, #3a4056 60%, #242838 100%);
    font-weight: 700;
  }
  .dpad .btn:active,
  .dpad .btn.pressed { transform-origin: center; }
  .dpad .up.pressed    { transform: translate(-50%, 2px); }
  .dpad .down.pressed  { transform: translate(-50%, -2px); }
  .dpad .left.pressed  { transform: translate(2px, -50%); }
  .dpad .right.pressed { transform: translate(-2px, -50%); }
  .dpad .ok.pressed    { transform: translate(-50%, -48%); }

  .section-label {
    font-size: 0.6rem;
    color: #6b7086;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin: 10px 0 6px;
  }

  .btn.accent { color: var(--accent); }
  .btn.small { font-size: 0.65rem; padding: 8px 4px; }

  footer {
    color: #5c6077;
    font-size: 0.75rem;
    margin-top: 18px;
    text-align: center;
  }
  footer kbd {
    background: #23273a; border: 1px solid #0a0c12;
    border-radius: 4px; padding: 1px 5px; color: #c9ccd9;
    font-family: inherit; font-size: 0.7rem;
  }
</style>
</head>
<body>

<h1><span class="brand">HyPro3000</span> PROJECTOR REMOTE</h1>

<div class="remote" role="group" aria-label="HyPro3000 projector remote">

  <div class="brand-plate">
    <span class="logo">HYPRO&nbsp;3000</span>
    <span class="led" id="led" aria-label="Status LED"></span>
  </div>

  <div class="screen" id="screen" aria-live="polite">
    <div class="line latest">● Ready — press POWER to start</div>
  </div>

  <div class="power-wrap">
    <button class="btn power" data-cmd="POWER" aria-label="Power">⏻</button>
  </div>

  <div class="section-label">Source</div>
  <div class="row four">
    <button class="btn small" data-cmd="SOURCE:HDMI1">HDMI 1</button>
    <button class="btn small" data-cmd="SOURCE:HDMI2">HDMI 2</button>
    <button class="btn small" data-cmd="SOURCE:VGA">VGA</button>
    <button class="btn small" data-cmd="SOURCE:USB">USB</button>
  </div>

  <div class="section-label">Navigation</div>
  <div class="dpad">
    <button class="btn up"    data-cmd="NAV:UP"    aria-label="Up">▲</button>
    <button class="btn down"  data-cmd="NAV:DOWN"  aria-label="Down">▼</button>
    <button class="btn left"  data-cmd="NAV:LEFT"  aria-label="Left">◀</button>
    <button class="btn right" data-cmd="NAV:RIGHT" aria-label="Right">▶</button>
    <button class="btn ok"    data-cmd="NAV:OK"    aria-label="OK">OK</button>
  </div>

  <div class="row three">
    <button class="btn" data-cmd="MENU">MENU</button>
    <button class="btn" data-cmd="HOME">HOME</button>
    <button class="btn" data-cmd="BACK">BACK</button>
  </div>

  <div class="section-label">Volume</div>
  <div class="row three">
    <button class="btn" data-cmd="VOL:DOWN">VOL −</button>
    <button class="btn accent" data-cmd="MUTE">MUTE</button>
    <button class="btn" data-cmd="VOL:UP">VOL +</button>
  </div>

  <div class="section-label">Picture</div>
  <div class="row two">
    <button class="btn" data-cmd="ZOOM:OUT">ZOOM −</button>
    <button class="btn" data-cmd="ZOOM:IN">ZOOM +</button>
  </div>
  <div class="row two">
    <button class="btn" data-cmd="FOCUS:OUT">FOCUS −</button>
    <button class="btn" data-cmd="FOCUS:IN">FOCUS +</button>
  </div>
  <div class="row two">
    <button class="btn" data-cmd="KEYSTONE:DOWN">KEYSTONE −</button>
    <button class="btn" data-cmd="KEYSTONE:UP">KEYSTONE +</button>
  </div>

  <div class="section-label">Modes</div>
  <div class="row three">
    <button class="btn small" data-cmd="MODE:CINEMA">CINEMA</button>
    <button class="btn small" data-cmd="MODE:GAME">GAME</button>
    <button class="btn small" data-cmd="MODE:PRESENT">PRESENT</button>
  </div>

  <div class="row three">
    <button class="btn small" data-cmd="FREEZE">FREEZE</button>
    <button class="btn small" data-cmd="BLANK">BLANK</button>
    <button class="btn small" data-cmd="ASPECT">ASPECT</button>
  </div>

</div>

<footer>
  Virtual remote UI — commands shown on the screen above.<br />
  Keyboard: <kbd>↑↓←→</kbd> navigate · <kbd>Enter</kbd> OK · <kbd>Esc</kbd> back ·
  <kbd>M</kbd> menu · <kbd>P</kbd> power · <kbd>+</kbd>/<kbd>−</kbd> volume
</footer>

<script>
  const state = {
    power: false,
    muted: false,
    volume: 40,
    source: "HDMI 1",
    mode: "CINEMA",
    frozen: false,
    blanked: false,
  };

  const screen = document.getElementById("screen");
  const led = document.getElementById("led");

  function print(msg) {
    // Demote old lines, add new latest
    [...screen.querySelectorAll(".line")].forEach(l => l.classList.remove("latest"));
    const line = document.createElement("div");
    line.className = "line latest";
    line.textContent = msg;
    screen.appendChild(line);
    // Keep last N
    const max = 4;
    while (screen.children.length > max) screen.removeChild(screen.firstChild);
  }

  function setPower(on) {
    state.power = on;
    led.classList.toggle("on", on);
    print(on ? "⏻ Power ON — booting lamp…" : "⏻ Power OFF — cooling down…");
  }

  function flash(btn) {
    if (!btn) return;
    btn.classList.add("pressed");
    setTimeout(() => btn.classList.remove("pressed"), 120);
  }

  function send(cmd, btn) {
    flash(btn);
    if (cmd === "POWER") { setPower(!state.power); return; }

    if (!state.power) {
      print("✖ Projector is OFF — press POWER first");
      return;
    }

    if (cmd.startsWith("SOURCE:")) {
      const s = cmd.split(":")[1].replace("HDMI1","HDMI 1").replace("HDMI2","HDMI 2");
      state.source = s;
      print("📺 Input → " + s);
    } else if (cmd === "VOL:UP") {
      state.volume = Math.min(100, state.volume + 5);
      state.muted = false;
      print("🔊 Volume " + state.volume);
    } else if (cmd === "VOL:DOWN") {
      state.volume = Math.max(0, state.volume - 5);
      print("🔉 Volume " + state.volume);
    } else if (cmd === "MUTE") {
      state.muted = !state.muted;
      print(state.muted ? "🔇 Muted" : "🔊 Unmuted (" + state.volume + ")");
    } else if (cmd.startsWith("NAV:")) {
      print("↕ Navigate: " + cmd.split(":")[1]);
    } else if (cmd === "MENU") {
      print("☰ Menu opened");
    } else if (cmd === "HOME") {
      print("⌂ Home screen");
    } else if (cmd === "BACK") {
      print("↩ Back");
    } else if (cmd.startsWith("ZOOM:")) {
      print("🔍 Zoom " + (cmd.endsWith("IN") ? "+" : "−"));
    } else if (cmd.startsWith("FOCUS:")) {
      print("◎ Focus " + (cmd.endsWith("IN") ? "+" : "−"));
    } else if (cmd.startsWith("KEYSTONE:")) {
      print("⌑ Keystone " + (cmd.endsWith("UP") ? "+" : "−"));
    } else if (cmd.startsWith("MODE:")) {
      state.mode = cmd.split(":")[1];
      print("🎨 Picture mode → " + state.mode);
    } else if (cmd === "FREEZE") {
      state.frozen = !state.frozen;
      print(state.frozen ? "❄ Image frozen" : "▶ Image resumed");
    } else if (cmd === "BLANK") {
      state.blanked = !state.blanked;
      print(state.blanked ? "⬛ Screen blanked" : "☀ Screen restored");
    } else if (cmd === "ASPECT") {
      print("▭ Aspect ratio cycled");
    } else {
      print("» " + cmd);
    }
  }

  // Wire up clicks
  document.querySelectorAll(".btn[data-cmd]").forEach(btn => {
    btn.addEventListener("click", () => send(btn.dataset.cmd, btn));
  });

  // Keyboard shortcuts
  const keyMap = {
    "ArrowUp":    "NAV:UP",
    "ArrowDown":  "NAV:DOWN",
    "ArrowLeft":  "NAV:LEFT",
    "ArrowRight": "NAV:RIGHT",
    "Enter":      "NAV:OK",
    "Escape":     "BACK",
    "m":          "MENU",
    "M":          "MENU",
    "p":          "POWER",
    "P":          "POWER",
    "+":          "VOL:UP",
    "=":          "VOL:UP",
    "-":          "VOL:DOWN",
    "_":          "VOL:DOWN",
  };
  document.addEventListener("keydown", (e) => {
    const cmd = keyMap[e.key];
    if (!cmd) return;
    e.preventDefault();
    const btn = document.querySelector('.btn[data-cmd="' + cmd + '"]');
    send(cmd, btn);
  });
</script>

</body>
</html>
